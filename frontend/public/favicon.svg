<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="mailora-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B1120" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>
    <linearGradient id="mailora-grad-primary" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
    <linearGradient id="mailora-grad-orbit" x1="3" y1="16" x2="29" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.25" />
      <stop offset="50%" stopColor="#818cf8" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#mailora-bg)" />
  <rect width="32" height="32" rx="7" stroke="#1e293b" stroke-width="1" />

  <!-- Orbit path encircling the mail core -->
  <ellipse
    cx="16"
    cy="16"
    rx="13"
    ry="5.8"
    transform="rotate(-26 16 16)"
    stroke="url(#mailora-grad-orbit)"
    stroke-width="1.5"
    stroke-dasharray="24 3 4 2"
    opacity="0.9"
  />

  <!-- Central Envelope Geometry -->
  <rect
    x="7.5"
    y="10"
    width="17"
    height="12"
    rx="2.5"
    fill="#0d1424"
    stroke="url(#mailora-grad-primary)"
    stroke-width="1.75"
  />
  <!-- Envelope Flap -->
  <path
    d="M8.2 11.2L16 17.2L23.8 11.2"
    stroke="url(#mailora-grad-primary)"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Signal telemetry waves emanating -->
  <path
    d="M21 7.2A6.5 6.5 0 0 1 25.2 11"
    stroke="#38bdf8"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Orbiting Signal Beacon Node -->
  <circle cx="26" cy="11.2" r="1.8" fill="#38bdf8" />
  <circle cx="26" cy="11.2" r="3" stroke="#38bdf8" stroke-width="0.6" opacity="0.6" />
</svg>